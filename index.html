<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live — Honour Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf8;--bg-alt:#f5f3f0;--bg-card:#ffffff;
  --gold:#d4af37;--gold-light:#e8d4a8;--gold-dark:#8b7e1a;
  --text-primary:#1a1a1a;--text-secondary:#616161;--text-muted:#9e9e9e;
  --accent:#b8860b;--accent-light:#daa520;--accent-dark:#6b4423;
  --border:#e8e8e8;--border-light:#f0f0f0;--shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
html,body{background:var(--bg);min-height:100vh;overflow-x:hidden}
body{font-family:'Inter',sans-serif;color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}

/* ══ INTRO ══ */
#intro{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#faf9f7 0%,#f5f1ed 50%,#efe8e3 100%);
  transition:opacity 1.4s cubic-bezier(.4,0,.2,1),transform 1.6s cubic-bezier(.4,0,.2,1);
}
#intro.out{opacity:0;transform:scale(1.08) translateY(-30px);pointer-events:none}

.star-field{position:absolute;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#d4af37;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.05}50%{opacity:var(--op,.3);transform:scale(1.4)}}

#fw-canvas{position:absolute;inset:0;z-index:1;pointer-events:none}
.intro-grid{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(212,175,55,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.02) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.4) 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.4) 0%,transparent 70%);
}

.intro-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:1}
.intro-orb1{width:400px;height:400px;background:rgba(212,175,55,.06);top:-80px;left:-80px;animation:orbF 8s ease-in-out infinite}
.intro-orb2{width:300px;height:300px;background:rgba(218,165,32,.04);bottom:-60px;right:-60px;animation:orbF 10s ease-in-out infinite 2s}
.intro-orb3{width:200px;height:200px;background:rgba(139,126,26,.03);top:40%;left:60%;animation:orbF 6s ease-in-out infinite 1s}
@keyframes orbF{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-25px)}}

.intro-center{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:0}

.intro-brand-row{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  opacity:0;animation:fSD .7s ease .2s forwards;
}
.intro-brand-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.5}
.intro-brand-name{font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;letter-spacing:7px;color:var(--gold-dark);text-transform:uppercase}
@keyframes fSD{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

/* Trophy */
.trophy-wrap{
  position:relative;width:150px;height:150px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:6px;
  opacity:0;animation:tIn .9s cubic-bezier(.34,1.56,.64,1) .5s forwards;
}
@keyframes tIn{from{opacity:0;transform:scale(.35) translateY(50px)}to{opacity:1;transform:scale(1) translateY(0)}}
.trophy-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.25) 0%,rgba(218,165,32,.08) 50%,transparent 70%);animation:tGlow 2s ease-in-out infinite alternate}
@keyframes tGlow{from{transform:scale(.88);opacity:.4}to{transform:scale(1.18);opacity:.8}}
.trophy-ring{
  position:absolute;inset:-10px;border-radius:50%;
  border:1.5px solid transparent;
  background:linear-gradient(#fafaf8,#fafaf8) padding-box,
    conic-gradient(from 0deg,rgba(212,175,55,.7),rgba(218,165,32,.1),rgba(212,175,55,.7)) border-box;
  animation:tRing 5s linear infinite;
}
@keyframes tRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.trophy-spark{
  position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);
  top:50%;left:50%;
  animation:spk var(--sd,2s) ease-out infinite var(--ss,.3s);
}
@keyframes spk{0%{transform:rotate(var(--sa,0deg)) translateX(0) scale(1);opacity:.9}100%{transform:rotate(var(--sa,0deg)) translateX(85px) scale(0);opacity:0}}

/* HONOUR WALL text */
.hw-title-wrap{text-align:center;margin-bottom:4px;opacity:0;animation:fSU .8s ease 1.1s forwards}
.hw-line1{
  font-family:'Playfair Display',serif;font-size:36px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(180deg,#1a1a1a 0%,#8b7e1a 50%,#d4af37 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;display:block;
  animation:tShimmer 3s ease-in-out infinite alternate;
  filter:drop-shadow(0 2px 8px rgba(212,175,55,.15));
}
@keyframes tShimmer{from{filter:drop-shadow(0 2px 6px rgba(212,175,55,.15))}to{filter:drop-shadow(0 2px 16px rgba(212,175,55,.35))}}
.hw-line2{
  font-family:'Playfair Display',serif;font-size:20px;font-weight:800;letter-spacing:18px;
  background:linear-gradient(90deg,#8b7e1a,#d4af37,#8b7e1a);
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block;margin-top:2px;
  animation:wFlow 3s linear infinite;
}
@keyframes wFlow{0%{background-position:0%}100%{background-position:200%}}
.hw-ornament{display:flex;align-items:center;gap:8px;margin:10px 0 5px;opacity:0;animation:fSU .6s ease 1.4s forwards}
.hw-orn-line{flex:1;height:1px;max-width:55px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.4))}
.hw-orn-line.r{background:linear-gradient(90deg,rgba(212,175,55,.4),transparent)}
.hw-orn-diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px rgba(212,175,55,.6)}
.intro-tagline{font-size:9px;letter-spacing:5px;color:var(--gold-dark);text-transform:uppercase;margin-top:4px;opacity:0;animation:fSU .6s ease 1.6s forwards;font-weight:600}
.intro-progress-wrap{width:170px;height:1.5px;background:rgba(212,175,55,.15);border-radius:2px;margin-top:20px;overflow:hidden;opacity:0;animation:fSU .6s ease 1.8s forwards}
.intro-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.5),var(--gold));box-shadow:0 0 8px var(--gold);animation:pFill 3.5s cubic-bezier(.4,0,.2,1) .3s forwards}
@keyframes pFill{from{width:0%}to{width:100%}}
@keyframes fSU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ══ MAIN ══ */
#main{display:none;width:100%;max-width:540px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding-bottom:80px}
#confetti-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.bg-glow1{width:600px;height:600px;background:radial-gradient(circle,rgba(212,175,55,.04) 0%,transparent 70%);top:-150px;right:-200px;animation:bgF 12s ease-in-out infinite}
.bg-glow2{width:500px;height:500px;background:radial-gradient(circle,rgba(218,165,32,.03) 0%,transparent 70%);bottom:50px;left:-150px;animation:bgF 16s ease-in-out infinite 3s}
@keyframes bgF{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-35px)}}

/* Header */
.page-header{
  position:sticky;top:0;z-index:50;min-height:56px;padding:0 14px;
  background:rgba(250,250,248,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden;
  border-bottom:1px solid var(--border);
}
.page-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(212,175,55,.4) 40%,rgba(212,175,55,.5) 50%,rgba(212,175,55,.4) 60%,transparent 95%);
  animation:hLine 4s ease-in-out infinite;
}
@keyframes hLine{0%,100%{opacity:.2}50%{opacity:.5}}
.page-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.1) 30%,rgba(139,126,26,.08) 70%,transparent)}
.hdr-left{display:flex;align-items:center;gap:9px;flex-shrink:0}
.hdr-text-group{display:flex;flex-direction:column;gap:1px}
.hdr-brand{
  font-family:'Playfair Display',serif;font-size:10px;font-weight:700;
  background:linear-gradient(90deg,#8b7e1a,#d4af37,#8b7e1a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:1.5px;line-height:1.2;white-space:nowrap;
}
.hdr-sub{font-size:7px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;white-space:nowrap;font-weight:600}
.hdr-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.hdr-title-main{
  font-family:'Playfair Display',serif;font-size:12px;font-weight:900;letter-spacing:5px;text-transform:uppercase;
  background:linear-gradient(180deg,#1a1a1a 0%,#6b4423 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;
}
.hdr-title-line{width:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.3),transparent);margin-top:1px}
.hdr-title-sub{font-size:6.5px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;white-space:nowrap;font-weight:600}

/* Hero Banner */
.hero-banner{position:relative;padding:20px 16px 14px;text-align:center;overflow:hidden;background:linear-gradient(135deg,rgba(212,175,55,.03),rgba(218,165,32,.02))}
.hero-banner::before{content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.2),transparent)}
.hero-week-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.12));
  border:1px solid rgba(212,175,55,.3);border-radius:30px;
  padding:5px 14px;margin-bottom:8px;
  font-family:'Poppins',sans-serif;font-size:8.5px;font-weight:700;
  color:var(--gold-dark);letter-spacing:3px;text-transform:uppercase;
  position:relative;overflow:hidden;
}
.hero-week-badge::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.1),transparent);animation:bSweep 3s ease-in-out infinite}
@keyframes bSweep{0%{left:-50%}100%{left:150%}}
.hero-title{
  font-family:'Playfair Display',serif;font-size:20px;font-weight:900;
  background:linear-gradient(180deg,#1a1a1a 0%,#8b7e1a 50%,#d4af37 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:2px;line-height:1.15;margin-bottom:5px;
}
.hero-sub{font-size:8.5px;color:var(--text-secondary);letter-spacing:4px;text-transform:uppercase;font-weight:600}

/* Section */
.section-block{opacity:0;transform:translateY(26px);transition:opacity .65s ease,transform .65s ease;padding-bottom:4px}
.section-block.visible{opacity:1;transform:translateY(0)}
.sec-header{position:relative;text-align:center;padding:20px 16px 10px}
.sec-header-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(212,175,55,.04) 0%,transparent 100%);pointer-events:none}
.sec-emoji{font-size:22px;margin-bottom:4px;display:block;filter:drop-shadow(0 1px 3px rgba(212,175,55,.2))}
.sec-title{font-family:'Playfair Display',serif;font-size:12.5px;font-weight:700;color:var(--gold-dark);letter-spacing:4px;text-transform:uppercase}
.sec-week{font-size:8px;color:var(--text-muted);letter-spacing:3px;margin-top:3px;text-transform:uppercase;font-weight:600}
.sec-ornament{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:7px}
.sec-orn-line{width:36px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.2))}
.sec-orn-line.r{background:linear-gradient(90deg,rgba(212,175,55,.2),transparent)}
.sec-orn-dot{width:3px;height:3px;border-radius:50%;background:rgba(212,175,55,.4)}

/* Top3 Row */
.top3-row{display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:10px 5px 15px}

/* Cards */
.top-card{
  display:flex;flex-direction:column;align-items:center;
  border-radius:20px;padding:15px 8px 17px;
  position:relative;flex:1;min-width:0;
  animation:cardIn .65s cubic-bezier(.34,1.2,.64,1) both;
  transition:transform .25s ease;overflow:visible;
  box-shadow:var(--shadow-md);
}
.top-card:active{transform:scale(.97)}
.top-card.rank1{
  background:linear-gradient(170deg,#faf8f5 0%,#f5f1ed 45%,#faf8f5 100%);
  border:1.5px solid rgba(212,175,55,.35);
  box-shadow:0 0 28px rgba(212,175,55,.15),0 12px 38px rgba(0,0,0,.08);
}
.top-card.rank2{
  background:linear-gradient(170deg,#fefdfb 0%,#faf8f5 50%,#fefdfb 100%);
  border:1px solid rgba(212,175,55,.25);
  box-shadow:0 0 18px rgba(212,175,55,.08),0 8px 28px rgba(0,0,0,.06);
}
.top-card.rank3{
  background:linear-gradient(170deg,#fffaf5 0%,#faf6f0 50%,#fffaf5 100%);
  border:1px solid rgba(212,175,55,.2);
  box-shadow:0 0 18px rgba(212,175,55,.06),0 8px 28px rgba(0,0,0,.05);
}
.top-card.rank1::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.3),transparent)}
.top-card.rank2::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.2),transparent)}
.top-card.rank3::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.15),transparent)}

.rank-badge{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:11px;z-index:10;font-weight:700}
.rank1 .rank-badge{background:linear-gradient(135deg,#ffd700,#d4af37,#a89a2e);color:#3a3a0a;box-shadow:0 2px 10px rgba(212,175,55,.35)}
.rank2 .rank-badge{background:linear-gradient(135deg,#e8e8e8,#d0d0d0,#b0b0b0);color:#2a2a2a;box-shadow:0 2px 8px rgba(100,100,100,.15)}
.rank3 .rank-badge{background:linear-gradient(135deg,#d4a574,#c9934d,#8b5a2b);color:#fff;box-shadow:0 2px 8px rgba(139,90,43,.25)}

.crown-ico{display:block;font-size:20px;text-align:center;margin-bottom:3px;line-height:1;filter:drop-shadow(0 1px 4px rgba(212,175,55,.3));animation:cFloat 2.8s ease-in-out infinite}
@keyframes cFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-5px) rotate(5deg)}}

/* DP */
.dp-wrap{position:relative;margin:0 auto;flex-shrink:0}
.dp-wrap.big{width:74px;height:74px}
.dp-wrap.sm{width:60px;height:60px}
.dp-img-circle{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#f5f1ed,#faf8f5);display:flex;align-items:center;justify-content:center}
.dp-img-circle img{width:100%;height:100%;object-fit:cover}
.dp-no-img{font-size:8px;color:#aaa;text-align:center;line-height:1.3}
.rank1 .dp-img-circle{border:2.5px solid var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.12),0 0 22px rgba(212,175,55,.18)}
.rank2 .dp-img-circle{border:2px solid #999;box-shadow:0 0 0 2px rgba(150,150,150,.08),0 0 12px rgba(150,150,150,.08)}
.rank3 .dp-img-circle{border:2px solid #b8860b;box-shadow:0 0 0 2px rgba(184,134,11,.08),0 0 12px rgba(184,134,11,.08)}
.dp-frame{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);pointer-events:none;object-fit:contain;z-index:3}
.dp-ring{position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed currentColor;opacity:.25;animation:rRot 14s linear infinite;pointer-events:none}
@keyframes rRot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.rank1 .dp-ring{color:var(--gold);opacity:.4}
.rank2 .dp-ring{color:#999}
.rank3 .dp-ring{color:#b8860b}

/* Tier badge */
.tier-label{display:inline-flex;align-items:center;gap:4px;border-radius:30px;padding:3px 9px 3px 7px;margin-top:7px;position:relative;overflow:hidden;flex-shrink:0}
.tier-label::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.15),transparent);animation:tSh 2.8s linear infinite}
@keyframes tSh{0%{left:-60%}100%{left:130%}}
.tier-diamond{background:linear-gradient(135deg,#fefdfb,#faf8f5,#fefdfb);border:1px solid rgba(212,175,55,.4);box-shadow:0 2px 8px rgba(212,175,55,.12)}
.tier-silver{background:linear-gradient(135deg,#f8f8f8,#f0f0f0,#f8f8f8);border:1px solid rgba(150,150,150,.3)}
.tier-bronze{background:linear-gradient(135deg,#faf5f0,#f5eee6,#faf5f0);border:1px solid rgba(184,134,11,.35)}
.tier-txt{font-family:'Poppins',sans-serif;font-size:7.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.tier-diamond .tier-txt{background:linear-gradient(90deg,#8b7e1a,#d4af37,#8b7e1a);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tFl 3s linear infinite}
.tier-silver .tier-txt{background:linear-gradient(90deg,#404040,#606060,#404040);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tFl 3s linear infinite}
.tier-bronze .tier-txt{background:linear-gradient(90deg,#6b4423,#b8860b,#6b4423);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tFl 3s linear infinite}
@keyframes tFl{0%{background-position:0%}100%{background-position:200%}}

/* Name */
.card-name{font-family:'Playfair Display',serif;font-size:10px;font-weight:700;color:var(--text-primary);text-align:center;word-break:break-word;max-width:126px;line-height:1.3;margin:6px 0;padding:0 3px;text-shadow:0 1px 2px rgba(0,0,0,.05)}
.rank1 .card-name{font-size:11.5px;text-shadow:0 0 8px rgba(212,175,55,.12),0 1px 2px rgba(0,0,0,.05)}
.rank2 .card-name{color:#333}
.rank3 .card-name{color:#2a2a2a}

/* Stat chip */
.stat-chip{
  display:flex;
  align-items:stretch;
  gap:7px;
  border-radius:12px;
  padding:7px 9px;
  width:100%;
  position:relative;
  overflow:visible;
  background:rgba(250,250,248,.8);
  border:1px solid var(--border);
  min-height:38px;
}
.chip-ruby{background:linear-gradient(135deg,rgba(220,100,140,.05),rgba(220,100,140,.08));border:1px solid rgba(220,100,140,.25)}
.chip-coin{background:linear-gradient(135deg,rgba(212,175,55,.06),rgba(212,175,55,.1));border:1px solid rgba(212,175,55,.3)}
.chip-clock{background:linear-gradient(135deg,rgba(70,130,180,.05),rgba(70,130,180,.08));border:1px solid rgba(70,130,180,.25)}
.chip-icon-wrap{
  width:24px;
  height:24px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  align-self:center;
}
.chip-ruby .chip-icon-wrap{background:rgba(220,100,140,.15);border:1.5px solid rgba(220,100,140,.3)}
.chip-coin .chip-icon-wrap{background:rgba(212,175,55,.15);border:1.5px solid rgba(212,175,55,.35)}
.chip-clock .chip-icon-wrap{background:rgba(70,130,180,.15);border:1.5px solid rgba(70,130,180,.3)}
.stat-body{
  display:flex;
  flex-direction:column;
  gap:1px;
  min-width:0;
  flex:1;
  justify-content:center;
}
.stat-label{
  font-size:5px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  line-height:1.1;
  white-space:nowrap;
  flex-shrink:0;
}
.chip-ruby .stat-label{color:rgba(150,50,80,.75)}
.chip-coin .stat-label{color:rgba(139,126,26,.8)}
.chip-clock .stat-label{color:rgba(40,80,120,.75)}
.stat-val{
  font-family:'Sora',sans-serif;
  font-size:12px;
  letter-spacing:.4px;
  line-height:1.2;
  white-space:nowrap;
  font-weight:700;
  overflow:hidden;
  text-overflow:clip;
}
.rank1 .stat-val{font-size:12.5px}
.chip-ruby .stat-val{color:#d46a7f}
.chip-coin .stat-val{color:var(--gold-dark)}
.chip-clock .stat-val{color:#4682b4}

.sec-divider{display:flex;align-items:center;gap:8px;margin:0 16px 8px}
.sdl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.12),transparent)}
.sdd{width:3px;height:3px;border-radius:50%;background:rgba(212,175,55,.3);transform:rotate(45deg)}

@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.top3-row .top-card.rank2{animation-delay:.06s}
.top3-row .top-card.rank1{animation-delay:.14s}
.top3-row .top-card.rank3{animation-delay:.22s}

/* Loading */
#loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px}
.loading-spinner{width:28px;height:28px;border-radius:50%;border:2px solid rgba(212,175,55,.15);border-top-color:var(--gold);animation:rRot 1s linear infinite}
.loading-txt{font-size:9px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;font-weight:600}

/* Footer */
.page-footer{text-align:center;padding:22px 16px 18px;border-top:1px solid var(--border);position:relative}
.page-footer::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.12),transparent)}
.footer-brand{font-family:'Playfair Display',serif;font-size:7px;font-weight:700;color:var(--text-muted);letter-spacing:5px;margin-bottom:6px;text-transform:uppercase}

@media(max-width:400px){
  .top3-row{gap:3px;padding:8px 3px 13px}
  .top-card{padding:14px 7px 16px;border-radius:16px}
  .dp-wrap.big{width:66px;height:66px}
  .dp-wrap.sm{width:54px;height:54px}
  .crown-ico{font-size:17px}
  .card-name{font-size:9px;max-width:106px}
  .rank1 .card-name{font-size:10px}
  .tier-label{padding:2px 7px 2px 5px}
  .tier-txt{font-size:7px;letter-spacing:1px}
  .stat-chip{padding:6px 7px;gap:5px;min-height:36px}
  .chip-icon-wrap{width:22px;height:22px;border-radius:5px}
  .stat-val{font-size:11px}
  .rank1 .stat-val{font-size:11.5px}
  .stat-label{font-size:4.5px}
  .hw-line1{font-size:28px;letter-spacing:6px}
  .hw-line2{font-size:17px;letter-spacing:12px}
  .hero-title{font-size:17px}
  .hdr-title-main{font-size:11px;letter-spacing:4px}
}
</style>
</head>
<body>
<canvas id="fw-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- INTRO -->
<div id="intro">
  <div class="star-field" id="star-field"></div>
  <div class="intro-grid"></div>
  <div class="intro-orb intro-orb1"></div>

  <div class="intro-center">
    <div class="intro-brand-row">
      <div class="intro-brand-dot"></div>
      <div class="intro-brand-name">Rizz Live</div>
      <div class="intro-brand-dot"></div>
    </div>

    <div class="trophy-wrap">
      <div class="trophy-glow"></div>
      <div class="trophy-ring"></div>
      <div class="trophy-spark" style="--sa:0deg;--sd:2.2s;--ss:0s"></div>
      <div class="trophy-spark" style="--sa:45deg;--sd:2.8s;--ss:.4s;background:#d4af37"></div>
      <div class="trophy-spark" style="--sa:90deg;--sd:2s;--ss:.8s;background:#4682b4"></div>
      <div class="trophy-spark" style="--sa:135deg;--sd:3s;--ss:.2s"></div>
      <div class="trophy-spark" style="--sa:180deg;--sd:2.4s;--ss:.6s;background:#d46a7f"></div>
      <div class="trophy-spark" style="--sa:225deg;--sd:2.6s;--ss:.1s;background:#d4af37"></div>
      <div class="trophy-spark" style="--sa:270deg;--sd:2.1s;--ss:.9s"></div>
      <div class="trophy-spark" style="--sa:315deg;--sd:2.9s;--ss:.3s;background:#4682b4"></div>

      <svg width="130" height="130" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:relative;z-index:2;filter:drop-shadow(0 2px 8px rgba(212,175,55,.35))">
        <defs>
          <linearGradient id="tg1" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffd700"/><stop offset="25%" stop-color="#d4af37"/>
            <stop offset="55%" stop-color="#b8860b"/><stop offset="80%" stop-color="#8b7e1a"/>
            <stop offset="100%" stop-color="#6b4423"/>
          </linearGradient>
          <linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0%" stop-color="#ffd700" stop-opacity=".95"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="tg3" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8b7e1a"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b7e1a"/>
          </linearGradient>
          <radialGradient id="tShine" cx="40%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#1a1a1a" stop-opacity=".15"/><stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
          </radialGradient>
          <filter id="tShadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#d4af37" flood-opacity=".25"/></filter>
        </defs>
        <g filter="url(#tShadow)">
          <path d="M32 18 Q30 56 44 68 Q52 75 60 75 Q68 75 76 68 Q90 56 88 18 Z" fill="url(#tg1)" stroke="rgba(0,0,0,.08)" stroke-width=".5"/>
          <path d="M32 18 Q30 56 44 68 Q52 75 60 75 Q68 75 76 68 Q90 56 88 18 Z" fill="url(#tShine)"/>
          <path d="M32 24 Q16 24 16 40 Q16 54 32 56" stroke="url(#tg1)" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M88 24 Q104 24 104 40 Q104 54 88 56" stroke="url(#tg1)" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M32 24 Q18 24 18 40 Q18 52 32 54" stroke="rgba(0,0,0,.1)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M88 24 Q102 24 102 40 Q102 52 88 54" stroke="rgba(0,0,0,.1)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <rect x="52" y="75" width="16" height="18" rx="3" fill="url(#tg1)"/>
          <rect x="36" y="93" width="48" height="9" rx="4" fill="url(#tg3)"/>
          <rect x="34" y="100" width="52" height="4" rx="2" fill="url(#tg3)"/>
          <polygon points="60,8 62.4,15.2 70,15.2 64,19.6 66.4,26.8 60,22.4 53.6,26.8 56,19.6 50,15.2 57.6,15.2" fill="#ffd700" stroke="rgba(212,175,55,.6)" stroke-width=".5" style="filter:drop-shadow(0 0 6px rgba(212,175,55,.8))"/>
          <line x1="45" y1="35" x2="75" y2="35" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
          <line x1="43" y1="46" x2="77" y2="46" stroke="rgba(0,0,0,.06)" stroke-width="1"/>
          <ellipse cx="46" cy="32" rx="4" ry="10" fill="rgba(255,255,255,.12)" transform="rotate(-20,46,32)"/>
        </g>
      </svg>
    </div>

    <div class="hw-title-wrap">
      <span class="hw-line1">HONOUR</span>
      <span class="hw-line2">WALL</span>
    </div>

    <div class="hw-ornament">
      <div class="hw-orn-line"></div>
      <div class="hw-orn-diamond"></div>
      <div class="hw-orn-line r"></div>
    </div>

    <div class="intro-tagline">#1 Live Platform</div>
    <div class="intro-progress-wrap"><div class="intro-progress-bar"></div></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="bg-glow bg-glow1"></div>
  <div class="bg-glow bg-glow2"></div>

  <div class="page-header">
    <div class="hdr-left">
      <div class="hdr-text-group">
        <div class="hdr-brand">RIZZ LIVE</div>
        <div class="hdr-sub">Weekly Honours</div>
      </div>
    </div>
    <div class="hdr-center">
      <div class="hdr-title-main">HONOUR WALL</div>
      <div class="hdr-title-line"></div>
      <div class="hdr-title-sub">Top Performers</div>
    </div>
    <div style="width:70px;flex-shrink:0"></div>
  </div>

  <div class="hero-banner">
    <div class="hero-week-badge">🏆 &nbsp; Weekly Champions</div>
    <div class="hero-title">Weekly Honour Wall</div>
    <div class="hero-sub">Top Performers</div>
  </div>

  <div id="sections-container">
    <div id="loading-state">
      <div class="loading-spinner"></div>
      <div class="loading-txt">Loading winners...</div>
    </div>
  </div>

  <div class="page-footer">
    <div class="footer-brand">RIZZ LIVE · WEEKLY HONOURS</div>
  </div>
</div>

<script>
// STARS
(function(){
  const sf=document.getElementById('star-field');
  for(let i=0;i<160;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.2+.4;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*5+2).toFixed(1)}s;--delay:${(Math.random()*6).toFixed(1)}s;--op:${(Math.random()*.3+.15).toFixed(2)}`;
    sf.appendChild(s);
  }
})();

// FIREWORKS (intro only)
(function(){
  const canvas=document.getElementById('fw-canvas'),ctx=canvas.getContext('2d');
  let W,H,active=true;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  const parts=[],rockets=[];
  function rand(a,b){return Math.random()*(b-a)+a}
  class Rocket{
    constructor(){this.x=rand(W*.12,W*.88);this.y=H;this.vy=rand(-17,-11);this.vx=rand(-2,2);this.target=rand(H*.08,H*.48);this.hue=rand(30,50);this.trail=[]}
    update(){
      this.trail.push({x:this.x,y:this.y});if(this.trail.length>10)this.trail.shift();
      this.x+=this.vx;this.y+=this.vy;this.vy+=.36;
      if(this.y<=this.target||this.vy>=0){this.explode();return false}return true;
    }
    explode(){
      const n=rand(75,120)|0;
      for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),sp=rand(1,8.5);parts.push({x:this.x,y:this.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,hue:this.hue+rand(-15,15),life:1,r:rand(1.5,3.8),g:.1})}
    }
    draw(){
      this.trail.forEach((t,i)=>{ctx.beginPath();ctx.arc(t.x,t.y,2*(i/this.trail.length),0,Math.PI*2);ctx.fillStyle=`hsla(${this.hue},100%,60%,${i/this.trail.length*.6})`;ctx.fill()});
      ctx.beginPath();ctx.arc(this.x,this.y,2.5,0,Math.PI*2);ctx.fillStyle=`hsl(${this.hue},100%,70%)`;ctx.fill();
    }
  }
  let last=0;
  function anim(){
    if(!active){ctx.clearRect(0,0,W,H);return}
    ctx.fillStyle='rgba(250,250,248,.1)';ctx.fillRect(0,0,W,H);
    const now=Date.now();
    if(now-last>rand(220,580)){rockets.push(new Rocket());last=now}
    for(let i=rockets.length-1;i>=0;i--){rockets[i].draw();if(!rockets[i].update())rockets.splice(i,1)}
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.97;p.life-=.013;
      if(p.life<=0){parts.splice(i,1);continue}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},100%,60%,${p.life})`;ctx.fill();
    }
    requestAnimationFrame(anim);
  }
  anim();
  window._stopFW=()=>{active=false};
})();

// CONFETTI
let confettiActive=false;
function startConfetti(){
  confettiActive=true;
  const canvas=document.getElementById('confetti-canvas'),ctx=canvas.getContext('2d');
  let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  const COLORS=['#d4af37','#8b7e1a','#d46a7f','#4682b4','#c9934d','#333'];
  const bits=Array.from({length:90},()=>({
    x:Math.random()*window.innerWidth,y:-20-Math.random()*window.innerHeight,
    w:Math.random()*8+3,h:Math.random()*5+2,color:COLORS[Math.floor(Math.random()*COLORS.length)],
    angle:Math.random()*360,spin:Math.random()*3-1.5,vy:Math.random()*2+.9,vx:Math.random()*1-.5,
    opacity:Math.random()*.5+.3,wobble:Math.random()*Math.PI*2,ws:Math.random()*.04+.01
  }));
  function draw(){
    if(!confettiActive)return;
    ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{
      b.y+=b.vy;b.x+=b.vx+Math.sin(b.wobble)*.3;b.angle+=b.spin;b.wobble+=b.ws;
      if(b.y>H+20){b.y=-20;b.x=Math.random()*W}
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle*Math.PI/180);
      ctx.globalAlpha=b.opacity;ctx.fillStyle=b.color;
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// CONFIG
const SECTIONS_CONFIG=[
  {key:'agency',     emoji:'🏆', title:'Top 3 Agency',          stat:{label:'Ruby Target',    type:'ruby'}},
  {key:'host',       emoji:'🎤', title:'Top 3 Host',             stat:{label:'Ruby Target',    type:'ruby'}},
  {key:'recharger',  emoji:'💰', title:'Top 3 Recharger',        stat:{label:'Recharge',type:'coin'}},
  {key:'activehost', emoji:'🔴', title:'Top 3 Active Host',      stat:{label:'Most of Time',   type:'clock'}},
];
const RANK_META={
  1:{tierLabel:'💎 Diamond',tierClass:'tier-diamond',sz:'big'},
  2:{tierLabel:'🥈 Silver', tierClass:'tier-silver', sz:'sm'},
  3:{tierLabel:'🥉 Bronze', tierClass:'tier-bronze', sz:'sm'},
};
const DISPLAY_ORDER=[2,1,3];
const DEFAULT_NAMES={1:'Winner Name',2:'Runner Up',3:'Third Place'};

function rubyIcon(s=16){return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs><linearGradient id="ri1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d46a7f"/><stop offset="35%" stop-color="#c13d5f"/><stop offset="100%" stop-color="#6b2040"/></linearGradient><linearGradient id="ri2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e88aa8" stop-opacity=".9"/><stop offset="100%" stop-color="#d46a7f" stop-opacity="0"/></linearGradient></defs><polygon points="16,2 28,12 16,30 4,12" fill="url(#ri1)"/><polygon points="16,2 24,12 16,10 8,12" fill="url(#ri2)" opacity=".85"/><polygon points="4,12 16,10 16,30" fill="#6b2040" opacity=".5"/><ellipse cx="13.5" cy="8.5" rx="2.5" ry="1.5" fill="#1a1a1a" opacity=".15" transform="rotate(-25,13.5,8.5)"/></svg>`}
function coinIcon(s=16){return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs><radialGradient id="coin-grad" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#fff9e0"/><stop offset="35%" stop-color="#ffd700"/><stop offset="70%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b7e1a"/></radialGradient><filter id="coin-shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8b7e1a" flood-opacity=".3"/></filter></defs><circle cx="16" cy="16" r="14" fill="url(#coin-grad)" filter="url(#coin-shadow)"/><circle cx="16" cy="16" r="13.5" fill="none" stroke="#b8a62e" stroke-width="0.8" opacity=".5"/><ellipse cx="16" cy="13" rx="2.5" ry="1.8" fill="#fff" opacity=".4"/></svg>`}
function clockIcon(s=16){return `<svg width="${s}" height="${s}" viewBox="0 0 32 32"><defs><radialGradient id="cli1" cx="40%" cy="35%"><stop offset="0%" stop-color="#6fa3d4"/><stop offset="50%" stop-color="#4682b4"/><stop offset="100%" stop-color="#2a5078"/></radialGradient></defs><circle cx="16" cy="16" r="13" fill="none" stroke="url(#cli1)" stroke-width="2"/><circle cx="16" cy="16" r="11" fill="#e8f4ff" opacity=".6"/><line x1="16" y1="16" x2="16" y2="8.5" stroke="#4682b4" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="16" x2="21.5" y2="19.5" stroke="#5a9dd4" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="16" r="2" fill="#4682b4"/></svg>`}
function getIcon(t,s){return t==='coin'?coinIcon(s):t==='clock'?clockIcon(s):rubyIcon(s)}
function getChipClass(t){return t==='coin'?'chip-coin':t==='clock'?'chip-clock':'chip-ruby'}

function buildCard(secCfg,rank,rData){
  const rm=RANK_META[rank],d=rData||{};
  const name=(d.name&&String(d.name).trim())?String(d.name).trim():DEFAULT_NAMES[rank];
  const stat=(d.stat&&String(d.stat).trim())?String(d.stat).trim():'—';
  const dp=d.dp||'',frame=d.frame||'';
  const card=document.createElement('div');
  card.className=`top-card rank${rank}`;
  const dpHTML=dp?`<img src="${esc(dp)}" alt="" onerror="this.parentNode.innerHTML='<div class=dp-no-img>NO DP</div>'">`:`<div class="dp-no-img">NO DP</div>`;
  const frameHTML=frame?`<img class="dp-frame" src="${esc(frame)}" alt="" onerror="this.remove()">`:`<div class="dp-ring"></div>`;
  const crownHTML=rank===1?`<span class="crown-ico">💎</span>`:'';
  card.innerHTML=`${crownHTML}<span class="rank-badge">${rank}</span><div class="dp-wrap ${rm.sz}"><div class="dp-img-circle">${dpHTML}</div>${frameHTML}</div><div class="tier-label ${rm.tierClass}"><span class="tier-txt">${rm.tierLabel}</span></div><div class="card-name">${esc(name)}</div><div class="stat-chip ${getChipClass(secCfg.stat.type)}"><div class="chip-icon-wrap">${getIcon(secCfg.stat.type,16)}</div><div class="stat-body"><span class="stat-label">${secCfg.stat.label}</span><span class="stat-val">${esc(stat)}</span></div></div>`;
  return card;
}

function buildSection(secCfg,secData){
  const week=(secData&&secData.week)?secData.week:'Week 1st';
  const block=document.createElement('div');block.className='section-block';
  block.innerHTML=`<div class="sec-header"><div class="sec-header-bg"></div><span class="sec-emoji">${secCfg.emoji}</span><div class="sec-title">${secCfg.title}</div><div class="sec-week">${esc(week)}</div><div class="sec-ornament"><div class="sec-orn-line"></div><div class="sec-orn-dot"></div><div class="sec-orn-line r"></div></div></div>`;
  const row=document.createElement('div');row.className='top3-row';
  DISPLAY_ORDER.forEach(rank=>{
    let rData=null;
    if(secData&&secData.ranks){rData=secData.ranks[rank]||secData.ranks[String(rank)]||null}
    row.appendChild(buildCard(secCfg,rank,rData));
  });
  block.appendChild(row);
  const div=document.createElement('div');div.className='sec-divider';div.innerHTML='<div class="sdl"></div><div class="sdd"></div><div class="sdl"></div>';
  block.appendChild(div);return block;
}

function renderSections(data){
  const container=document.getElementById('sections-container');container.innerHTML='';
  SECTIONS_CONFIG.forEach((cfg,i)=>{
    const secData=data&&data.sections?data.sections[cfg.key]:null;
    const block=buildSection(cfg,secData);container.appendChild(block);
    setTimeout(()=>block.classList.add('visible'),120*i+80);
  });
}

function applyLogo(src){
  if(!src)return;
  const iImg=document.getElementById('intro-logo-img'),iFb=document.getElementById('intro-logo-fallback');
  if(iImg){iImg.onload=()=>{iImg.style.display='block';if(iFb)iFb.style.display='none'};iImg.onerror=()=>{iImg.style.display='none';if(iFb)iFb.style.display='flex'};iImg.src=src}
}

async function loadData(){
  let data=null;
  try{const res=await fetch('./rizz-data.json?v='+Date.now());if(res.ok){const t=await res.text();if(t&&t.trim()!=='{}')data=JSON.parse(t)}}catch(e){}
  if(data&&data.logo)applyLogo(data.logo);
  renderSections(data);
}

function enterMain(){
  if(window._stopFW)window._stopFW();
  const intro=document.getElementById('intro'),main=document.getElementById('main');
  intro.classList.add('out');
  setTimeout(()=>{intro.style.display='none';main.style.display='block';startConfetti();loadData();window.scrollTo(0,0)},900);
}
setTimeout(enterMain,4200);

(function(){
  fetch('./rizz-data.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.logo)applyLogo(d.logo)}).catch(()=>{});
})();

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
